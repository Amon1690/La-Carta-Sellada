name: Cola de mejoras

# Solo administración manual de issues. No modelos, claves, agentes ni horarios.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agents-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Crear tareas iniciales sin duplicados
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: await require('./tools/agents/github.cjs').bootstrap({ github, context, core });
