<header>
  <a class="logo" routerLink="/" aria-label="Ir a campañas">
    <span class="logo-mark">LC</span>
    <span>La Carta Sellada</span>
  </a>

  @if (access.user()?.role === 'director') {
  <form class="search" (submit)="submitSearch($event)">
    <label>
      <span>Buscar</span>
      <input
        [disabled]="!campaignId()"
        [value]="term()"
        (input)="updateTerm($any($event.target).value)"
        [placeholder]="campaignId() ? 'Buscar en la campaña...' : 'Selecciona una campaña para buscar'"
      />
    </label>
  </form>
  }

  <div class="actions" aria-label="Sesión"><span>{{ access.user()?.username }} · {{ access.user()?.role }}</span><button class="logout" type="button" (click)="logout()">Cerrar sesión</button></div>
</header>
@if (error()) { <p role="alert">{{ error() }}</p> }
